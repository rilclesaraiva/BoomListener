name: Build APK do Android

# Toda vez que algo entra na main, sai um APK novo (igual ao BusBus).
# Também pode ser disparado à mão pela aba "Actions" do GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Escrita: para criar a Release e para comentar no commit quando o build falha.
# O GITHUB_TOKEN é gerado pelo próprio GitHub a cada execução.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Sem os Secrets de assinatura, sai um APK de debug (instalável para teste)
      # e nenhuma Release é criada. Com eles, sai o APK de release assinado.
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Ler a versão do gradle.properties
        id: version
        run: echo "version=$(grep '^APP_VERSION=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # JDK 21 roda o Gradle. O SDK do Android já vem instalado no runner
      # ubuntu-latest (sem android-actions/setup-android, que quebrou o BusBus).
      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      # A chave nunca fica no repositório: é decodificada aqui, só durante o
      # build, e some junto com a máquina da Action.
      - name: Preparar a chave de assinatura
        if: env.HAS_SIGNING_KEY == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.p12
          cat > keystore.properties <<PROPS
          storeFile=release.p12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS

      # A saída inteira vai para build.log: os logs da Action não são legíveis
      # pela sessão do Claude, então, se falhar, o passo seguinte posta o
      # resumo do erro como comentário no commit (ver CLAUDE.md).
      - name: Testes + build do APK
        shell: bash
        run: |
          set -o pipefail
          if [ "$HAS_SIGNING_KEY" = "true" ]; then TASK=assembleRelease; else TASK=assembleDebug; fi
          ./gradlew test "$TASK" --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Postar o erro como comentário no commit (só se falhar)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### ❌ Build falhou (run ${{ github.run_id }})"
            echo
            echo "**Erros encontrados:**"
            echo '```'
            grep -E "^e: |error:|What went wrong|Could not|FAILED" -A4 build.log | head -n 120 || true
            echo '```'
            echo
            echo "**Fim do log:**"
            echo '```'
            tail -n 80 build.log || true
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md

      - name: Renomear o APK (boomlistener_v{versão}.apk)
        id: apk
        shell: bash
        run: |
          V="${{ steps.version.outputs.version }}"
          if [ "$HAS_SIGNING_KEY" = "true" ]; then
            SRC=app/build/outputs/apk/release/app-release.apk
            OUT="boomlistener_v${V}.apk"
          else
            SRC=app/build/outputs/apk/debug/app-debug.apk
            OUT="boomlistener_v${V}-debug.apk"
          fi
          cp "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Guardar o APK como artefato do build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}

      # Nota da Release = seção desta versão no CHANGELOG.md.
      - name: Extrair a nota de versão do CHANGELOG.md
        if: env.HAS_SIGNING_KEY == 'true'
        run: |
          awk -v ver="## [${{ steps.version.outputs.version }}]" '
            index($0, ver) == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

      - name: Publicar/atualizar a Release do GitHub
        if: env.HAS_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Boom, listener! v${{ steps.version.outputs.version }}
          files: ${{ steps.apk.outputs.path }}
          body_path: release_notes.md
