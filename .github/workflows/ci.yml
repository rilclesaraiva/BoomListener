name: CI

# Todo push na main: testes + APK de release (R8 + assinatura) como "build para
# vistoria", nos artefatos desta execução. O mantenedor instala e testa.
# Release pública: o commit "chore(release): vX.Y.Z" (só depois da vistoria e
# de "confirmo release vX.Y.Z" do mantenedor, ver CLAUDE.md) faz o job
# release criar a tag e publicar.
on:
  push:
    branches: [main]
    tags: ['v*']

# Escrita: para criar a Release e para comentar no commit quando o build falha.
permissions:
  contents: write

env:
  # ── Ajuste da stack (Android) ──
  VERSION_FILE: gradle.properties                     # APP_VERSION=X.Y.Z
  TEST_CMD: ./gradlew testDebugUnitTest assembleRelease --no-daemon --stacktrace
  RELEASE_CMD: ./gradlew assembleRelease --no-daemon --stacktrace
  APK: app/build/outputs/apk/release/app-release.apk
  # ── Assinatura (os Secrets ficam só no GitHub; sem eles o APK sai sem assinatura) ──
  KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # JDK 21 roda o Gradle (o app compila para Java 17). O SDK do Android já
      # vem no runner (sem android-actions/setup-android, que quebrou o BusBus).
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6

      - name: Assinatura (pulada se não houver secrets)
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Versão
        id: version
        run: echo "version=$(grep '^APP_VERSION=' "$VERSION_FILE" | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      # A saída vai para build.log: os logs da Action não são legíveis pela
      # sessão do Claude, então, se falhar, o passo seguinte posta o resumo do
      # erro como comentário no commit.
      - name: Testes + build de release
        shell: bash
        run: |
          set -o pipefail
          eval "$TEST_CMD" 2>&1 | tee build.log

      - name: Postar o erro no commit (só se falhar)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo "### ❌ Build falhou (run ${{ github.run_id }})"
            echo
            echo "**Erros encontrados:**"
            echo '```'
            grep -E "^e: |error:|What went wrong|Could not|FAILED" -A4 build.log | head -n 120 || true
            echo '```'
            echo
            echo "**Fim do log:**"
            echo '```'
            tail -n 80 build.log || true
            echo '```'
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md

      # Build para vistoria: boomlistener_v0.56.0-build628.apk (o número é o da
      # execução do CI, para saber qual build é qual); a Release pública usa
      # boomlistener_v0.56.0.apk.
      - name: Nome do build para vistoria
        id: vistoria
        run: |
          N="boomlistener_v${{ steps.version.outputs.version }}-build${GITHUB_RUN_NUMBER}"
          cp "$APK" "$N.apk"
          echo "name=$N" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.vistoria.outputs.name }}
          path: ${{ steps.vistoria.outputs.name }}.apk
          if-no-files-found: error

  # Release pública. Caminho normal: o commit "chore(release): vX.Y.Z" chega
  # na main com APP_VERSION=X.Y.Z e a seção [X.Y.Z] no CHANGELOG; como a tag
  # ainda não existe, este job cria a tag (com o token do Actions) e publica.
  # A sessão do Claude não consegue enviar tags (403 no proxy). Um push de
  # tag vX.Y.Z feito à mão continua funcionando como reserva.
  release:
    needs: ci
    runs-on: ubuntu-latest
    concurrency: release   # duas execuções não publicam a mesma versão ao mesmo tempo
    steps:
      - uses: actions/checkout@v6

      # Decide se há Release a publicar. Na main: só se a tag da versão ainda
      # não existe e o CHANGELOG já tem a seção dela (a versão só sobe com
      # "confirmo release vX.Y.Z"); fora disso, nada acontece.
      - name: Decidir se publica
        id: decide
        shell: bash
        run: |
          V="$(grep '^APP_VERSION=' "$VERSION_FILE" | cut -d= -f2)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
            [ "$TAG" = "v$V" ] || { echo "$TAG não bate com APP_VERSION=$V"; exit 1; }
          else
            TAG="v$V"
            if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
              echo "$TAG já existe: nada a publicar"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          awk -v v="$V" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            [[ "$GITHUB_REF" == refs/tags/v* ]] && { echo "$TAG não está no CHANGELOG"; exit 1; }
            echo "Sem seção [$V] no CHANGELOG: nada a publicar"; echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v6
        if: steps.decide.outputs.publish == 'true'
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v6
        if: steps.decide.outputs.publish == 'true'

      # Na Release a assinatura é obrigatória: um APK sem assinatura não
      # instala por cima do app e não pode ser publicado.
      - name: Assinatura (obrigatória na Release)
        if: steps.decide.outputs.publish == 'true'
        run: |
          [ -n "$KEYSTORE_B64" ] || { echo "Sem os Secrets da keystore: a Release não sai sem assinatura"; exit 1; }
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"

      - name: Build de release
        if: steps.decide.outputs.publish == 'true'
        run: |
          eval "$RELEASE_CMD"
          cp "$APK" "boomlistener_${{ steps.decide.outputs.tag }}.apk"

      # Cria a tag neste commit (se ainda não existe) e publica a Release.
      - uses: softprops/action-gh-release@v3
        if: steps.decide.outputs.publish == 'true'
        with:
          tag_name: ${{ steps.decide.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BoomListener ${{ steps.decide.outputs.tag }}
          body_path: notes.md
          files: boomlistener_${{ steps.decide.outputs.tag }}.apk
